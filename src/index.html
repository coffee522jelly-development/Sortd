<!DOCTYPE html>
<html lang="ja">
<head>

  <style>
    body { font-family: sans-serif; padding: 20px; }
    button { padding: 10px 20px; margin: 10px 0; cursor: pointer; display: block; width: 100%; }
    #status { margin-top: 20px; padding: 10px; border: 1px solid #ccc; min-height: 50px; }
  </style>
</head>
<body>
  <div style="margin-bottom: 20px;">
    <label for="prefixInput">整理用フォルダの接頭辞:</label>

  </div>
  <button id="deleteBtn">「新しいフォルダー」を一括削除</button>
  <button id="organizeBtn">ファイルを拡張子ごとに整理</button>
  <button id="classifyBtn">フォルダを内容で分類</button>
  <div id="status">ステータス: 待機中</div>
  <script src="renderer.js"></script>
</body>
</html>
