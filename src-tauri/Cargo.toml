[package]
name = "desktop-organizer"
version = "1.0.0"
description = "Desktop file and folder organization utility"
authors = ["User"]
license = "ISC"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
dirs = "6.0"
